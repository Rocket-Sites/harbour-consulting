# Publishes this site to the agency's Cloudflare Pages account, using the
# agency's own credentials. Generated by Rocket Sites; safe to edit by hand.
#
# `mode` is written out literally rather than left to a default, so this repo
# says what state its own site is in and a later change to the publisher's
# default cannot silently change it.
#
#   public  world readable. What a client marketing site is for, and the default.
#   gated   behind Cloudflare Access, for showing a client the site before it is
#           announced. A deliberate choice, never the default.
#
# This site is PUBLIC: world readable, which is what a client marketing site
# is for. It names no access input, and it must not: the publisher refuses
# `public` combined with client-emails, client-domain or agency-domain.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  publish:
    uses: Rocket-Sites/rs-publisher/.github/workflows/deploy-site.yml@v1
    with:
      project-name: harbour-consulting
      mode: public
      # Which Cloudflare account this site deploys to. A VARIABLE, not a secret:
      # it opens nothing on its own, Cloudflare prints it in every dashboard URL,
      # and a variable can be read back -- which is what lets the Rocket Sites
      # console tell you which account this site publishes to (issue #81).
      cf-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Superseded by cf-account-id above and still forwarded, because an agency
      # onboarded before #81 has the account id only as an organisation SECRET
      # and a new site in that organisation would otherwise deploy with nothing.
      # The publisher prefers the input where both are set.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
